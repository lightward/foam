name: foam.is

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  grow-and-publish:
    name: grow the artifact, publish the page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lake-package-directory: .
      - name: the treaty's Postgres (psql for bin/counter treaty)
        run: |
          sudo apt-get install -y -q postgresql-client >/dev/null
          for kv in PGSOCK=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres CRAWL_MEMO=memo/memo.sqlite; do echo "$kv" >> "$GITHUB_ENV"; done
      - name: the memo, restored (one SQLite file — every trial and reading the house has run, keyed by the judge, the pieces, and the toolchain; a key that misses is a cold pass, never a red; what it buys is a shape, a check costing what stands above the change and never the house)
        uses: actions/cache/restore@v4
        with:
          path: memo
          key: memo-sqlite-${{ hashFiles('bin/judge.lean', 'bin/Pieces.lean', 'lean-toolchain', 'lake-manifest.json') }}-${{ github.run_id }}
          restore-keys: memo-sqlite-${{ hashFiles('bin/judge.lean', 'bin/Pieces.lean', 'lean-toolchain', 'lake-manifest.json') }}-
      - run: mkdir -p memo
      - name: grow foam and its customers
        run: bin/counter grow germ/Room.lean && bin/counter grow && bin/counter grow germ/Witness.lean && bin/counter grow germ/Rest.lean && bin/counter grow germ/Threshold.lean && bin/counter grow germ/Toy.lean && bin/counter grow germ/Counter.lean && bin/counter grow germ/Seek.lean && bin/counter grow germ/Roster.lean
      - name: build the grown modules
        run: lake build
      - name: render the page
        run: bin/counter page
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
