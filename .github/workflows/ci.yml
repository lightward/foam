name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    name: the gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lake-package-directory: .
      - name: the treaty's Postgres (psql for bin/counter treaty)
        run: |
          sudo apt-get install -y -q postgresql-client >/dev/null
          for kv in PGSOCK=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres CRAWL_MEMO=memo/memo.sqlite; do echo "$kv" >> "$GITHUB_ENV"; done
      - name: the memo, restored (one SQLite file — every trial and reading the house has run, keyed by the judge, the pieces, and the toolchain; a key that misses is a cold pass, never a red; what it buys is a shape, a check costing what stands above the change and never the house)
        uses: actions/cache/restore@v4
        with:
          path: memo
          key: memo-sqlite-${{ hashFiles('bin/judge.lean', 'bin/Pieces.lean', 'lean-toolchain', 'lake-manifest.json') }}-${{ github.run_id }}
          restore-keys: memo-sqlite-${{ hashFiles('bin/judge.lean', 'bin/Pieces.lean', 'lean-toolchain', 'lake-manifest.json') }}-
      - run: mkdir -p memo
      - name: grow Room, then Face on it, then Witness and Rest on Face, then Threshold where they meet (every vacancy regrows; each germ its own settle; the standards print)
        run: bin/counter grow germ/Room.lean --check && bin/counter grow --check && bin/counter grow germ/Witness.lean --check && bin/counter grow germ/Rest.lean --check && bin/counter grow germ/Threshold.lean --check
      - name: "grow the customers on foam (germ/Toy.lean, germ/Counter.lean, germ/Seek.lean, germ/Roster.lean — their own settles)"
        run: bin/counter grow germ/Toy.lean --check && bin/counter grow germ/Counter.lean --check && bin/counter grow germ/Seek.lean --check && bin/counter grow germ/Roster.lean --check
      - name: build the grown modules
        run: lake build
      - name: the gate, drawn from the compiler's own species (Counter.gate — silent, every receipt read by the kernel and empty, one receipt per organ; the grown assays too)
        run: bin/counter gate
      - name: the treaty vectors (every assay elaborates against the grown modules; an assay with rows in its grown form)
        run: |
          for f in assays/*.lean; do
            [ -f "$f" ] || continue
            g="grown/assays/$(basename "$f")"
            src="$f"; [ -f "$g" ] && src="$g"
            lake env lean "$src"
            echo "assay green: $src"
          done
      - name: the treaty in SQL (the shadow loads into Postgres; the assay's rows replay as queries)
        run: |
          bin/counter treaty assays/eih.lean
          bin/counter treaty assays/cycle.lean
      - name: "the pins (every artifact against the pins committed beside the germs — identical, or red: a pin moves in the same commit as its cause, bin/counter pin --set)"
        run: bin/counter pin
      - name: the memo, saved (the cache is immutable per key, so every run saves under its own and the next restores the latest by prefix)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: memo
          key: memo-sqlite-${{ hashFiles('bin/judge.lean', 'bin/Pieces.lean', 'lean-toolchain', 'lake-manifest.json') }}-${{ github.run_id }}
